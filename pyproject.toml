[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-magazine-layout-generator"
version = "0.4.2"
description = "AI-driven magazine layout generator: grids, spreads, pagination, and print-ready export."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-magazine-layout-generator contributors" }]
keywords = ["magazine", "layout", "pagination", "grid", "publishing", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Desktop Environment",
]

dependencies = [
    "pydantic>=2.7,<3",
    "fonttools>=4.53",
    "Pillow>=10.3",
    "reportlab>=4.2",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
ui = [
    "PySide6>=6.7",
]

[project.scripts]
magazine-layout = "magazine_layout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["magazine_layout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=magazine_layout --cov-report=term-missing"